apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: MAIL_HOST
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-notifications-production-config-secret
                   key: MAIL_HOST
             - name: MAIL_PORT
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-notifications-production-config-secret
                   key: MAIL_PORT
             - name: MAIL_USER
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-notifications-production-config-secret
                   key: MAIL_USER
             - name: MAIL_PASSWORD
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-notifications-production-config-secret
                   key: MAIL_PASSWORD
             - name: MAIL_FROM
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-notifications-production-config-secret
                   key: MAIL_FROM
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-notifications-production-config-secret
                   key: RABBITMQ_URL
