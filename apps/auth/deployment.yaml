apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           ports:
             - containerPort: PORT_CONTAINER
           env:
             - name: RABBITMQ_URL
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-auth-production-config-secret
                   key: RABBITMQ_URL
             - name: JWT_ACCESS_SECRET
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-auth-production-config-secret
                   key: JWT_ACCESS_SECRET
             - name: JWT_ACCESS_EXPIRES_IN
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-auth-production-config-secret
                   key: JWT_ACCESS_EXPIRES_IN
             - name: JWT_REFRESH_SECRET
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-auth-production-config-secret
                   key: JWT_REFRESH_SECRET
             - name: JWT_REFRESH_EXPIRES_IN
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-auth-production-config-secret
                   key: JWT_REFRESH_EXPIRES_IN
             - name: DATABASE_URL
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-auth-production-config-secret
                   key: DATABASE_URL
             - name: FRONTEND_URL
               valueFrom:
                 secretKeyRef:
                   name: nest-backend-auth-production-config-secret
                   key: FRONTEND_URL
