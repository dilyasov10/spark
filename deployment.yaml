# Три деплоймента на один образ: приложения монорепы отличаются только точкой
# входа, поэтому собирается и пушится один образ, а `command` выбирает, какое
# из них поднимать.
#
# Метка `component` обязана быть и в селекторе: без неё все три деплоймента
# имеют одинаковый `project: PROJECT` и начинают тянуть друг у друга поды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
      component: gateway
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
        component: gateway
    spec:
      containers:
         - name: PROJECT
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           # Единственное приложение с HTTP-портом: наружу торчит только оно,
           # микросервисы доступны через очередь.
           command: ["node", "dist/apps/gateway/main"]
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true      # опционально, но хорошая практика
             runAsUser: 1000         # опционально
           # Секреты живут в объекте Secret, а не в манифесте: этот файл лежит
           # в git. Создаётся отдельно, вне пайплайна (см. README деплоя).
           # Без RABBITMQ_URL и JWT-секретов приложение падает на старте:
           # ConfigService вызывает getOrThrow, и под уходит в CrashLoopBackOff.
           envFrom:
             - secretRef:
                 name: nest-backend-secrets
           env:
             - name: PORT
               value: "PORT_CONTAINER"
           ports:
             - containerPort: PORT_CONTAINER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME-auth
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
      component: auth
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
        component: auth
    spec:
      containers:
         - name: PROJECT-auth
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           command: ["node", "dist/apps/auth/main"]
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true
             runAsUser: 1000
           # Здесь нужен и DATABASE_URL: в базу из всей тройки ходит только
           # этот сервис.
           envFrom:
             - secretRef:
                 name: nest-backend-secrets
           # Портов нет намеренно: сервис слушает очередь, а не сокет, и
           # Service на него заводить не за что.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME-notifications
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
      component: notifications
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
        component: notifications
    spec:
      containers:
         - name: PROJECT-notifications
           image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
           command: ["node", "dist/apps/notifications/main"]
           securityContext:
             allowPrivilegeEscalation: false
             runAsNonRoot: true
             runAsUser: 1000
           # Из секрета берутся MAIL_*: SMTP-креды нужны только этому сервису.
           envFrom:
             - secretRef:
                 name: nest-backend-secrets
